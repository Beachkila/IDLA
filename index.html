function text(ctx, s, x, y, col, sc = 1, f = 'C') {
  const G = f === 'A' ? FONTA : FONTC; s = String(s); if (f !== 'A') s = s.toUpperCase();
  ctx.fillStyle = col; let cx = x;
  for (const ch of s) {
    const g = G[ch] || G['?'];
    const rows = g[1];
    for (let i = 0; i < rows.length; i++) { let r = rows[i], b = 0; while (r) { if (r & 1) ctx.fillRect(cx + b * sc, y + (i - 3) * sc, sc, sc); r >>= 1; b++; } }
    cx += g[0] * sc;
  }
}
function tw(s, sc = 1, f = 'C') {
  const G = f === 'A' ? FONTA : FONTC; s = String(s); if (f !== 'A') s = s.toUpperCase();
  let w = 0; for (const ch of s) w += (G[ch] || G['?'])[0]; return Math.max(0, w - 1) * sc;

  { s0: -1.2, s1: 0.6,  w: 2.5,  part: 'body' },
  { s0: -1.7, s1: -1.2, w: 3.9,  part: 'squeegee' },
  { s0: -4.0, s1: -1.7, w: 1.5,  part: 'operator' },
];
let PARTS = TRUCK_PARTS, WB = 3.5, CENTER_S = 0.5;   // wheelbase: drive wheel -> trailing wheels (ft)
function fwdOf(h) { return [Math.cos(h), Math.sin(h)]; }
function truckCenter(t) { const f = fwdOf(t.h); return [t.x + f[0] * CENTER_S, t.y + f[1] * CENTER_S]; }
function palletCenter(t) { const f = fwdOf(t.h); return [t.x - f[0] * 2.6, t.y - f[1] * 2.6]; }
function partPoly(x, y, h, p, loaded) {
  const f = fwdOf(h), n = [-f[1], f[0]], w = (p.part === 'pallet' && !loaded ? p.wE : p.w) / 2;
  const P = (s, q) => [x + f[0] * s + n[0] * q, y + f[1] * s + n[1] * q];
  return [P(p.s0, -w), P(p.s1, -w), P(p.s1, w), P(p.s0, w)];
}
function polyHitsRect(poly, r) {
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  for (const [x, y] of poly) { a = Math.min(a, x); b = Math.max(b, x); c = Math.min(c, y); d = Math.max(d, y); }
  if (b <= r[0] || a >= r[2] || d <= r[1] || c >= r[3]) return false;
  const rc = [[r[0], r[1]], [r[2], r[1]], [r[2], r[3]], [r[0], r[3]]];
  for (let i = 0; i < 2; i++) {
    const ex = poly[i + 1][0] - poly[i][0], ey = poly[i + 1][1] - poly[i][1], ax = -ey, ay = ex;
    let p0 = Infinity, p1 = -Infinity, q0 = Infinity, q1 = -Infinity;
    for (const [x, y] of poly) { const v = x * ax + y * ay; p0 = Math.min(p0, v); p1 = Math.max(p1, v); }
    for (const [x, y] of rc) { const v = x * ax + y * ay; q0 = Math.min(q0, v); q1 = Math.max(q1, v); }
    if (p1 <= q0 || q1 <= p0) return false;
  }

}
function cartRect(c) { return c.horiz ? [c.x - 2.5, c.y - 1.25, c.x + 2.5, c.y + 1.25] : [c.x - 1.25, c.y - 2.5, c.x + 1.25, c.y + 2.5]; }
// what would the truck hit at this pose? -> { part, cart } or null
function polysHit(a, b) {   // separating-axis test for two convex quads
  for (const poly of [a, b]) for (let i = 0; i < 2; i++) {
    const ax = -(poly[i + 1][1] - poly[i][1]), ay = poly[i + 1][0] - poly[i][0];
    let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
    for (const [x, y] of a) { const v = x * ax + y * ay; a0 = Math.min(a0, v); a1 = Math.max(a1, v); }
    for (const [x, y] of b) { const v = x * ax + y * ay; b0 = Math.min(b0, v); b1 = Math.max(b1, v); }
    if (a1 <= b0 || b1 <= a0) return false;
  }

}
function truckHitsTruck(x, y, h, loaded, o) {
  for (const p of PARTS) { const a = partPoly(x, y, h, p, loaded); for (const q of PARTS) if (polysHit(a, partPoly(o.x, o.y, o.h, q, o.loaded))) return true; }
  return false;
}
function collideAt(x, y, h, loaded, skip) {
  for (const p of PARTS) {
    const poly = partPoly(x, y, h, p, loaded);
    for (const s of SOLID) if (polyHitsRect(poly, s)) return { part: p.part };
    for (const c of G.carts) if (polyHitsRect(poly, cartRect(c))) return { part: p.part, cart: c };
  }
  for (const o of OTHERS) if (!(skip && skip.has(o.id)) && truckHitsTruck(x, y, h, loaded, o)) return { part: 'truck', truck: o };

}
function truckAABB(t, pad = 0) {
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  for (const p of PARTS) for (const [x, y] of partPoly(t.x, t.y, t.h, p, t.loaded)) { a = Math.min(a, x); b = Math.max(b, x); c = Math.min(c, y); d = Math.max(d, y); }
  return [a - pad, c - pad, b + pad, d + pad];
}

// ---------- carts ----------
function newCart(i) {
  let x, y;
  do { x = pick(LANES_X); y = pick(LANES_Y); } while (Math.hypot(x - 64, y - 83) < 25);
  const c = { x, y, tx: x, ty: y, horiz: false, wait: 0, skin: 'c' + (i % 3), stopped: 0, help: false };
  chooseNext(c); return c;
}
function chooseNext(c) {
  const opts = [];
  const xi = LANES_X.indexOf(Math.round(c.x)), yi = LANES_Y.indexOf(Math.round(c.y));
  if (xi > 0) opts.push([LANES_X[xi - 1], c.y]); if (xi < LANES_X.length - 1) opts.push([LANES_X[xi + 1], c.y]);
  if (yi > 0) opts.push([c.x, LANES_Y[yi - 1]]); if (yi < LANES_Y.length - 1) opts.push([c.x, LANES_Y[yi + 1]]);
  const back = opts.filter(o => !(o[0] === c.px && o[1] === c.py));
  const o = pick(back.length ? back : opts);
  c.px = c.x; c.py = c.y; c.tx = o[0]; c.ty = o[1];
}
function updateCarts(dt) {
  const tr = truckAABB(G.truck, 0.6);
  for (const c of G.carts) {
    if (c.stopped > 0) { c.stopped -= dt; continue; }
    if (c.wait > 0) { c.wait -= dt; continue; }
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
    if (d < 0.05) { c.x = c.tx; c.y = c.ty; if (Math.random() < 0.3) c.wait = rnd(0.5, 2.5); chooseNext(c); continue; }
    const sp = 2.6 * dt, nx = c.x + dx / d * Math.min(sp, d), ny = c.y + dy / d * Math.min(sp, d);
    const horiz = Math.abs(dx) > Math.abs(dy);
    const nr = horiz ? [nx - 2.5, ny - 1.25, nx + 2.5, ny + 1.25] : [nx - 1.25, ny - 2.5, nx + 1.25, ny + 2.5];
    if (overlap(nr, tr)) { c.wait = 0.4; continue; }   // shoppers wait for the truck
    c.x = nx; c.y = ny; c.horiz = horiz; c.dir = horiz ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  }
}

// ---------- driving ----------
function updateDrive(dt) {
  const t = G.truck;
  G.clock += dt;
  if (G.toastT > 0) G.toastT -= dt;
  G.honk = Math.max(0, G.honk - dt);
  t.scrapeCd = Math.max(0, t.scrapeCd - dt);
  t.hitCd = Math.max(0, (t.hitCd || 0) - dt);
  if (!G.task && t.loaded) { G.waitTask -= dt; if (G.waitTask <= 0) giveLocalTask(); }
  const [tcx, tcy] = truckCenter(t);
  if (input.bEdge) {
    G.honk = 0.45; horn(); netSend({ t: 'horn' });
    for (const c of G.carts) if (Math.hypot(c.x - tcx, c.y - tcy) < 24) c.stopped = 2.5;
  }
  if (mode.carts) { if (G.netCarts && NET.state === 'on') G.carts = netCarts(); else updateCarts(dt); }
  if (mode.help && !G.help) {
    G.helpT -= dt;
    if (G.helpT <= 0) {
      const c = G.carts.find(c => Math.hypot(c.x - tcx, c.y - tcy) < 16);
      if (c) startHelp(c); else G.helpT = 3;
    }
  }
  if (t.stun > 0) t.stun -= dt;
  else drive(t, dt);

  // zone checks: pallet over the zone and lined up with the shelf
  const [px, py] = palletCenter(t);
  const f = G.task ? G.task.face : null;
  const parallel = f && (f.ax === 'h' ? Math.abs(Math.cos(t.h)) > 0.94 : Math.abs(Math.sin(t.h)) > 0.94);
  G.canAct = null; G.hint = null;
  if (t.loaded && G.task && inside(px, py, G.task.zone.map((v, i) => v + (i < 2 ? -1.5 : 1.5)))) {
    if (parallel) { G.canAct = 'UNLOAD'; if (input.aEdge) startBattle(); }
    else G.hint = 'LINE THE PALLET UP WITH THE SHELF';
  } else if (!t.loaded && inside(tcx, tcy, STAGE)) {
    G.canAct = 'PICK UP';
    if (input.aEdge) {
      t.loaded = true; requestTask(); beep(660, 0.1); beep(880, 0.12);
    }
  }
}
// joystick = where the operator wants to walk. Within ~100 deg of the heading he pulls
// (walks ahead, pallet trails); behind that he pushes the forks first.
function drive(t, dt) {
  let jx = input.jx + input.kx, jy = input.jy + input.ky;
  const m = Math.min(1, Math.hypot(jx, jy));
  if (m < 0.18) { t.moving = false; return; }
  const a = Math.atan2(jy, jx);
  const wrap = v => Math.atan2(Math.sin(v), Math.cos(v));
  let rel = wrap(a - t.h), rev = false;
  if (Math.abs(rel) > Math.PI * 0.58) { rev = true; rel = wrap(a - t.h - Math.PI); }
  if (rev !== !t.pulling) { t.pulling = !rev; t.delta = 0; }
  const MAXD = 1.4;                                   // ~80 deg tiller
  const target = Math.max(-MAXD, Math.min(MAXD, rel));
  t.delta += Math.max(-6 * dt, Math.min(6 * dt, target - t.delta));
  const speed = (mode.zamboni ? (rev ? 1.5 : ZSPEEDS[G.zam.speed].v) : (rev ? 3.2 : (t.loaded ? 6 : 7.5))) * m * (charIdx === 1 ? 1.015 : 1);
  const ang = (rev ? t.h + Math.PI : t.h) + t.delta;
  const f = fwdOf(t.h), Lx = t.x - f[0] * WB, Ly = t.y - f[1] * WB;
  // trucks I'm already touching (e.g. both spawned on one spot) don't block me, so we can separate
  const skip = new Set(OTHERS.filter(o => truckHitsTruck(t.x, t.y, t.h, t.loaded, o)).map(o => o.id));
  for (const frac of [1, 0.5, 0.25]) {
    const sp = speed * dt * frac;
    const nx = t.x + Math.cos(ang) * sp, ny = t.y + Math.sin(ang) * sp;
    const nh = Math.atan2(ny - Ly, nx - Lx);         // load wheels trail like a trailer hitch
    const hit = collideAt(nx, ny, nh, t.loaded, skip);
    if (!hit) { t.x = nx; t.y = ny; t.h = nh; t.moving = true; t.moved = true; t.anim += dt; t.frame = ((t.anim * 8) | 0) % 4; return; }
    if (hit.truck) {
      t.moving = false;
      if (!(t.hitCd > 0)) { t.hitCd = 1; netSend({ t: 'hit', o: hit.truck.id }); beep(95, 0.12, 'square', 0.06); }
      return;
    }
    if (hit.cart) {
      t.stun = 0.6; hit.cart.stopped = 1.5; G.bumps++; G.score -= 25; G.combo = 0;
      if (G.netCarts) netSend({ t: 'cart', i: hit.cart.i, hold: 1.5 });
      beep(120, 0.2, 'sawtooth', 0.08); toast('BUMPED A CART!  -25'); t.moving = false; return;
    }
    if (frac === 0.25) {
      t.moving = false;
      if (t.scrapeCd <= 0) {
        t.scrapeCd = 1.2; beep(70, 0.12, 'sawtooth', 0.06);
        if (mode.zamboni) { G.scrapes++; G.score -= 10; toast('BUMPED THE SHELF  -10', 1.2); }
        else if (hit.part === 'pallet') { G.scrapes++; G.score -= 10; toast('PALLET CLIPPED THE SHELF  -10', 1.2); }
        else toast('WATCH THE CORNER - SWING WIDER', 1);
      }
    }
  }
}


// ---------- help requests (hard) ----------
function startHelp(c) {
  const areas = Object.keys(PRODUCTS);
  const count = {}; for (const a of areas) for (const p of PRODUCTS[a]) count[p] = (count[p] || 0) + 1;
  let a, p; do { a = pick(areas); p = pick(PRODUCTS[a]); } while (count[p] > 1);
  const wrong = shuffle(areas.filter(x => x !== a)).slice(0, 2);
  G.help = { cart: c, product: p, area: a, opts: shuffle([a, ...wrong]), t: 10, result: null, rt: 0 };
  c.stopped = 99; if (G.netCarts) netSend({ t: 'cart', i: c.i, hold: 14 }); beep(520, 0.1); beep(620, 0.1);
}
function updateHelp(dt) {
  const h = G.help; G.clock += dt;
  if (h.result) { h.rt -= dt; if (h.rt <= 0) { h.cart.stopped = 1; if (G.netCarts) netSend({ t: 'cart', i: h.cart.i, hold: 1 }); G.help = null; G.helpT = rnd(20, 35); } return; }
  h.t -= dt;
  if (h.t <= 0) answerHelp(null);
}
function answerHelp(a) {
  const h = G.help;
  if (a === h.area) { G.score += 150; G.helpOk++; h.result = 'THANK YOU!  +150'; beep(784, 0.1); beep(1046, 0.15); }
  else { G.score -= 100; G.helpBad++; h.result = (a ? 'THAT\'S NOT IT...' : 'NEVER MIND...') + '  -100'; beep(150, 0.25, 'sawtooth', 0.06); }
  h.rt = 1.4;
}

// ---------- battle ----------
const SEC_W = 81, SHELF_H = 36, SX0 = 6, SY0 = 14, SLOT_W = 35, SLOT_H = 26;
function slotXY(sec, shelf, k) { return [SX0 + sec * (SEC_W + 1) + 3 + k * 39, SY0 + 2 + shelf * SHELF_H + 6]; }
function startBattle() {
  const a = G.task.face.a;
  if (mode.daily) G.rng = seeded(parseInt(G.day.replace(/-/g, ''), 10) * 31 + G.palletNo * 977);
  const prods = rshuffle(PRODUCTS[a].slice()).map(n => ({ n, col: hashCol(n + a) }));
  const list = rshuffle([...prods, ...prods, ...prods]);
  const slots = [];
  let i = 0;
  for (let sec = 0; sec < 3; sec++) for (let shelf = 0; shelf < 4; shelf++) for (let k = 0; k < 2; k++) {
    const [x, y] = slotXY(sec, shelf, k);
    slots.push({ sec, shelf, k, x, y, want: list[i++], got: null, wrong: false });
  }
  const queue = rshuffle(slots.map(s => s.want));
  G.popups = [];
  G.battle = { slots, queue, total: queue.length, drag: null, shake: 0, flash: null, flashT: 0 };
  state = 'battle'; beep(440, 0.08); beep(660, 0.08);
}
function battlePointer(type, x, y) {
  const b = G.battle; if (!b.queue.length) return;
  if (type === 'down') {
    if (x >= 4 && x <= 44 && y >= 163 && y <= 191) b.drag = { x, y, ox: x - 6, oy: y - 165 };
  } else if (type === 'move' && b.drag) { b.drag.x = x; b.drag.y = y; }
  else if (type === 'up' && b.drag) {
    const cx = x - b.drag.ox + SLOT_W / 2, cy = y - b.drag.oy + SLOT_H / 2;
    const s = b.slots.find(s => !s.got && cx >= s.x - 3 && cx <= s.x + SLOT_W + 3 && cy >= s.y - 4 && cy <= s.y + SLOT_H + 4);
    b.drag = null;
    if (s) place(s);
  }
}
function place(s) {
  const b = G.battle, c = b.queue[0];
  const ok = s.want.n === c.n;
  if (!ok && mode.block) {
    G.blocked++; G.score -= 20; G.combo = 0; b.shake = 0.3; b.flash = 'WRONG SPOT  -20'; b.flashT = 1;
    beep(110, 0.2, 'sawtooth', 0.07); return;
  }
  b.queue.shift(); s.got = c; G.placed++;
  if (ok) {
    G.correct++; G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo);
    const pts = 100 + Math.min(G.combo, 10) * 10; G.score += pts;
    G.popups.push({ s: (G.combo >= 3 ? 'x' + G.combo + ' ' : '') + '+' + pts, t: 0.9 });
    beep(520 + Math.min(G.combo, 12) * 40, 0.07);
  } else {
    s.wrong = true; G.auditErrors++; G.combo = 0;
    G.popups.push({ s: 'PLACED', t: 0.6 }); beep(300, 0.07);
  }
  if (!b.queue.length) {
    setTimeout(() => {
      state = 'drive'; G.truck.loaded = false; G.battle = null; netSend({ t: 'done' });
      if (G.palletNo >= G.pallets) endShift();
      else { G.palletNo++; toast('EMPTY. RETURN TO PALLET PICKUP'); }
    }, 700);
    beep(660, 0.1); beep(880, 0.1); beep(1100, 0.18);
  }
}
function endShift() {
  if (mode.zamboni) {
    G.cover = Math.min(1000, Math.round(G.zam.credit / ZWALKN * 1000));   // tenths of a percent of the floor you cleaned
    G.timeBonus = 0; G.auditPenalty = 0;
    G.final = G.cover * 10 + G.zam.spillsDone * 150 + G.score;
  } else {
    const par = 150 + 45 * G.pallets;
    G.timeBonus = Math.max(0, Math.round((par - G.clock) * 5));
    G.auditPenalty = G.auditErrors * 150;
    G.final = G.score + G.timeBonus - G.auditPenalty;
  }
  const key = 'best.' + modeKey + (mode.daily ? '.' + G.day : '');
  const best = store(key);
  G.newBest = !best || G.final > best.score;
  if (G.newBest) store(key, { score: G.final, time: Math.round(G.clock), date: todayUTC() });
  G.posted = false; G.post = null;
  netLeave();
  if (API) postScore();
  state = 'results'; beep(523, 0.12); beep(659, 0.12); beep(784, 0.2);
}

function panel(ctx, x0, y0, x1, y1, fill = UI) {
  ctx.fillStyle = INK; ctx.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  ctx.fillStyle = LINE; ctx.fillRect(x0 + 1, y0 + 1, x1 - x0 - 1, y1 - y0 - 1);
  ctx.fillStyle = fill; ctx.fillRect(x0 + 2, y0 + 2, x1 - x0 - 3, y1 - y0 - 3);
}
function bar(ctx, x, y, w, frac, col) {
  ctx.fillStyle = INK; ctx.fillRect(x, y, w, 6);
  ctx.fillStyle = col; ctx.fillRect(x + 1, y + 1, Math.max(0, Math.round((w - 2) * Math.max(0, Math.min(1, frac)))), 4);
}
const fmtClock = s => ((s / 60) | 0) + ':' + pad2((s % 60) | 0);
function header(ctx) {
  ctx.fillStyle = UI2; ctx.fillRect(0, 0, SW, 13);
  text(ctx, 'IDLA', 4, 3, HI); textFit(ctx, mode.name, 42, 3, PAPER, 96);
  const p = 'PLT ' + G.palletNo + '/' + G.pallets; text(ctx, p, 204 - tw(p), 3, PAPER);
  const c = fmtClock(G.clock); text(ctx, c, 252 - tw(c), 3, HI);
}

function drawTruck(ctx, t, sx, sy, ch = charIdx) {
  if (mode.zamboni) {
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(t.h + Math.PI / 2);
    ctx.drawImage(IMG[CHARS[ch].pre + 'zb' + t.frame], -17, -26);
    ctx.restore(); return;
  }
  const im = IMG[CHARS[ch].pre + (t.loaded ? 'tl' : 'te') + (t.pulling ? 'p' : '') + t.frame];
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(t.h + Math.PI / 2);
  ctx.drawImage(im, -15, -38);
  ctx.restore();
}
function drawCart(ctx, c, x, y) {
  const ang = [0, Math.PI / 2, Math.PI, -Math.PI / 2][c.dir || 0];
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(ang);
  ctx.drawImage(IMG[c.skin], -7, -13);

}

function drawDriveTop() {
  T.drawImage(mapC, 0, 0);
  header(T);
  const X = f => MOX + f * MAPS, Y = f => MOY + f * MAPS;
  const blink = (G.clock * 3 | 0) % 2;
  const z = G.truck.loaded ? (G.task ? G.task.zone : null) : STAGE;
  T.strokeStyle = blink ? '#ffffff' : HI; T.lineWidth = 1;
  if (z) T.strokeRect(Math.round(X(z[0])) + .5, Math.round(Y(z[1])) + .5, Math.round((z[2] - z[0]) * MAPS), Math.round((z[3] - z[1]) * MAPS));
  for (const o of OTHERS) for (const [col, grow] of [[INK, 0.7], ['#f6f4ec', 0]]) {
    T.fillStyle = col;
    for (const p of PARTS) {
      const poly = partPoly(o.x, o.y, o.h, { ...p, w: p.w + grow, wE: (p.wE || p.w) + grow, s0: p.s0 - grow / 2, s1: p.s1 + grow / 2 }, o.loaded);
      T.beginPath(); poly.forEach(([x, y], i) => i ? T.lineTo(X(x), Y(y)) : T.moveTo(X(x), Y(y))); T.fill();
    }
  }
  for (const c of G.carts) { T.fillStyle = INK; T.fillRect(Math.round(X(c.x)) - 2, Math.round(Y(c.y)) - 2, 5, 5); T.fillStyle = '#3c6ec8'; T.fillRect(Math.round(X(c.x)) - 1, Math.round(Y(c.y)) - 1, 3, 3); }
  for (const [col, grow] of [[INK, 0.7], [BAD, 0]]) {
    T.fillStyle = col;
    for (const p of PARTS) {
      const poly = partPoly(G.truck.x, G.truck.y, G.truck.h, { ...p, w: p.w + grow, wE: (p.wE || p.w) + grow, s0: p.s0 - grow / 2, s1: p.s1 + grow / 2 }, G.truck.loaded);
      T.beginPath(); poly.forEach(([x, y], i) => i ? T.lineTo(X(x), Y(y)) : T.moveTo(X(x), Y(y))); T.fill();
    }
  }
  // task panel
  panel(T, 203, 16, 254, 171);
  let y = 21;
  const K = s => { textA(T, s, 207, y, MUTE); y += 8; };            // small label
  const L = (s, c = PAPER) => { s = String(s); if (tw(s) <= 45) { text(T, s, 207, y, c); y += 10; } else { textA(T, s, 207, y, c); y += 8; } };
  K('Task');
  if (G.truck.loaded && !G.task) { L('WAIT', PAPER); K('for pallet'); }
  else if (G.truck.loaded) {
    const n = ANAME[G.task.face.a].split(/[ +]/);
    for (const w of n) L(w, AC[G.task.face.a] === '#ebebe1' ? PAPER : AC[G.task.face.a]);
    L(pad2(G.task.tags[0]) + '-' + pad2(G.task.tags[1]), HI);

let last = 0, tt = 0;

const ZCELL = 0.5, ZGW = 240, ZGH = 188, ZTIME = 120;
const ZSPEEDS = [   // ft/s, how much one pass cleans, how fast spills lift
  { name: 'SNAIL',   v: 1.7, q: 1,   spill: 3.0 },
  { name: 'WALKING', v: 3.4, q: 1,   spill: 1.2 },
  { name: 'RABBIT',  v: 5.1, q: 0.5, spill: 0.35 },

let ZWALK = null, ZWALKN = 0;
function zamWalkMask() {
  if (ZWALK) return;

  for (let j = 0; j < ZGH; j++) for (let i = 0; i < ZGW; i++) {
    const x = (i + 0.5) * ZCELL, y = (j + 0.5) * ZCELL;
    if (!SOLID.some(s => x > s[0] && x < s[2] && y > s[1] && y < s[3])) { ZWALK[j * ZGW + i] = 1; ZWALKN++; }

}
const SPILL_KINDS = ['#5aa0e6', '#7a4a24', '#f6f4ec', '#d63c34', '#e8c040', '#3c9650'];
function zamStart() {

    left: ZTIME, spills: [], spillsDone: 0, img: zamX.createImageData(ZGW, ZGH), prev: null,
    credit: 0, online: false, outPts: [], spillOut: new Map() };
  const d = Z.img.data;
  for (let k = 0; k < ZGW * ZGH; k++) { d[k * 4] = 14; d[k * 4 + 1] = 12; d[k * 4 + 2] = 22; d[k * 4 + 3] = ZWALK[k] ? 205 : 0; }
  zamX.putImageData(Z.img, 0, 0);
  let tries = 0;
  while (Z.spills.length < 14 && tries++ < 3000) {
    const x = rnd(7, 113), y = rnd(7, 87), r = rnd(0.8, 1.4);
    if (Math.hypot(x - 64, y - 83) < 14 || Z.spills.some(s => Math.hypot(s.x - x, s.y - y) < 7)) continue;
    let ok = true;
    for (let a = 0; a < 12 && ok; a++) {
      const px = x + Math.cos(a / 12 * 6.283) * r * 1.8, py = y + Math.sin(a / 12 * 6.283) * r * 1.8;
      const i = (px / ZCELL) | 0, j = (py / ZCELL) | 0;

function zamNet(m) {
  const Z = G.zam;
  if (m.zd) for (let k = 0; k < m.zd.length; k += 2) zamSetCell(m.zd[k], m.zd[k + 1] / 255);
  if (m.sp) zamSetSpills(m.sp);
  if (m.zs) { const me = m.zs.find(e => e[0] === NET.id); if (me) { Z.credit = me[1]; Z.spillsDone = me[2]; } }
}
function drawSpill(ctx, s, sx, sy, scale) {
  const r = seeded(s.seed);
  ctx.globalAlpha = 0.25 + 0.75 * Math.max(0, s.hp);
  ctx.fillStyle = s.col;

    const a = r() * 6.283, d = r() * s.r * 0.6, rr = s.r * (0.45 + r() * 0.4);

function zamDrawFloor(cx, cy, vw, vh) {

  B.imageSmoothingEnabled = false;
  B.drawImage(zamC, cx / k, cy / k, vw / k, vh / k, 0, 0, vw, vh);
  for (const s of G.zam.spills) if (s.hp > 0) {

}
function drawZamTop() {
  const Z = G.zam, X = f => MOX + f * MAPS, Y = f => MOY + f * MAPS;
  T.drawImage(mapC, 0, 0);
  T.imageSmoothingEnabled = false;
  T.drawImage(zamC, 0, 0, ZGW, ZGH, MOX, MOY, 120 * MAPS, 94 * MAPS);

    T.fillStyle = col;
    for (const p of PARTS) {
      const poly = partPoly(o.x, o.y, o.h, { ...p, w: p.w + grow, s0: p.s0 - grow / 2, s1: p.s1 + grow / 2 }, false);

      T.beginPath(); poly.forEach(([x, y], i) => i ? T.lineTo(X(x), Y(y)) : T.moveTo(X(x), Y(y))); T.fill();
    }
  }
  T.fillStyle = UI2; T.fillRect(0, 0, SW, 13);
  text(T, 'IDLA', 4, 3, HI); text(T, 'ZAMBONI', 42, 3, PAPER);
  const zc = fmtClock(Math.ceil(Z.left)); text(T, zc, 252 - tw(zc), 3, Z.left < 15 && (tt * 4 | 0) % 2 ? BAD : HI);
  panel(T, 203, 16, 254, 171);
  let y = 21;
  const K = s => { textA(T, s, 207, y, MUTE); y += 8; };
  const L = (s, c = PAPER) => { s = String(s); if (tw(s) <= 45) { text(T, s, 207, y, c); y += 10; } else { textA(T, s, 207, y, c); y += 8; } };
  K('Cleaned'); L((Z.credit / ZWALKN * 100).toFixed(1) + '%', GOOD);
  y += 3; K('Spills'); L(Z.spillsDone + '/' + Z.spills.length, PAPER);
  y += 3; K('Score'); L(zamScore(), PAPER);
  y += 3; K('Speed'); L(ZSPEEDS[Z.speed].name, [GOOD, HI, BAD][Z.speed]);
  y += 3; K('Bumps'); L(G.scrapes + G.crashes, G.scrapes + G.crashes ? BAD : GOOD);
  if (NET.state === 'on') { y += 3; textA(T, (OTHERS.length + 1) + ' here', 207, y, '#8cb8f0'); } else if (FLOOR_API) { y += 3; K(NET.state === 'connecting' ? 'Joining...' : 'Solo'); }
  bar(T, 207, 162, 42, Z.left / ZTIME, Z.left < 15 ? BAD : GOOD);
  T.fillStyle = UI; T.fillRect(0, 173, 202, 19);
  textFit(T, G.toastT > 0 ? G.toast : 'SCRUB THE DARK FLOOR CLEAN', 5, 179, G.toastT > 0 ? HI : PAPER, 194);
}

// ---------- in-game menu (opening it takes you off the floor and pauses your clock) ----------
const MENU_BTN = [212, 2, 253, 15];
function drawMenuButton() { panel(B, MENU_BTN[0], MENU_BTN[1], MENU_BTN[2], MENU_BTN[3], UI2); textC(B, 'MENU', 233, 5, PAPER); }
function openMenu() {
  if (!G || !['drive', 'battle'].includes(state)) return;
  G.menuFrom = state; G.menuView = 'main';
  if (G.battle) G.battle.drag = null;
  state = 'menu'; netSend({ t: 'away' }); beep(520, 0.05);
}
function resumeMenu() { state = G.menuFrom; NET.lastKey = ''; NET.lastSend = 0; beep(660, 0.05); }
function drawMenu() {
  T.fillStyle = UI2; T.fillRect(0, 0, SW, SH);

  textC(T, mode.name, 128, 58, MUTE);
  if (mode.zamboni) {
    textC(T, 'LEFT ' + fmtClock(Math.ceil(G.zam.left)) + '  SCORE ' + zamScore(), 128, 80, PAPER);
  } else {
    textC(T, 'PLT ' + G.palletNo + '/' + G.pallets + '  SCORE ' + G.score + '  ' + fmtClock(G.clock), 128, 80, PAPER);
  }

    const lines = mode.zamboni
      ? [['STICK', 'Walk the scrubber'], ['AHEAD', 'Scrub forward'], ['BACK', 'Back up slowly'], ['A', 'Change speed'], ['', 'Snail: cleans fully, lifts spills fast'], ['', 'Walking: normal'], ['', 'Rabbit: fast but streaky, spills lift slowly'], ['B', 'Horn'], ['', 'The cleaning path is 32 inches wide']]
      : [['STICK', 'Walk the operator'], ['AHEAD', 'Pull. The pallet trails behind'], ['BACK', 'Push, forks first'], ['A', 'Unload / pick up a pallet'], ['B', 'Horn. Shoppers stop'], ['DRAG', 'Unload cases onto their spots'], ['', 'Take corners wide: the pallet'], ['', 'cuts inside on turns']];
    lines.forEach(([k, l], i) => { if (k) text(B, k, 12, 22 + i * 14, HI); textA(B, l, 62, 23 + i * 14, PAPER); });
    const back = [12, 160, 120, 186];
    panel(B, back[0], back[1], back[2], back[3], UI); textC(B, '< BACK', 66, 170, PAPER);
    BTN.push({ r: back, f: () => { G.menuView = 'main'; } });
    return;
  }

    [[12, 6, 244, 36], 'RESUME', GOOD, 2, resumeMenu],
    [[12, 42, 244, 64], 'RESTART SHIFT', HI, 1, () => newShift(modeKey)],
    [[12, 70, 244, 92], 'QUIT TO TITLE', BAD, 1, () => { netLeave(); state = 'title'; }],
    [[12, 98, 124, 122], 'SOUND: ' + (SOUND ? 'ON' : 'OFF'), SOUND ? GOOD : LINE, 1, () => { SOUND = !SOUND; store('sound', SOUND); beep(660, 0.05); }],
    [[132, 98, 244, 122], 'INITIALS: ' + (SHOW_INI ? 'ON' : 'OFF'), SHOW_INI ? GOOD : LINE, 1, () => { SHOW_INI = !SHOW_INI; store('showini', SHOW_INI); }],
    [[12, 128, 244, 150], 'CONTROLS', '#3c78d2', 1, () => { G.menuView = 'controls'; }],
  ];
  for (const [r, label, col, sc, f] of items) {
    panel(B, r[0], r[1], r[2], r[3], UI);
    B.fillStyle = col; B.fillRect(r[0] + 3, r[1] + 3, 3, r[3] - r[1] - 5);
    textC(B, label, (r[0] + r[2]) / 2 + 1, (r[1] + r[3]) / 2 - (sc === 2 ? 7 : 3), PAPER, sc);
    BTN.push({ r, f });
  }
  textAC(B, 'Quitting ends the shift without a score', 128, 166, LINE);
}

// ---------- joystick + A/B on menu screens ----------
const MENU_STATES = ['title', 'modes', 'chars', 'results', 'initials', 'board', 'menu'];
const NAV = { i: -1, on: false, st: '', hold: 0, dir: null, ini: 0 };
function navList() {
  if (state === 'drive' && G && G.help && G.help.btns && !G.help.result) return G.help.btns.map(b => ({ r: b.r, f: () => answerHelp(b.a) }));
  if (MENU_STATES.includes(state)) return BTN;
  return null;
}
function navBack() {
  if (state === 'title') return;
  if (state === 'modes' || state === 'chars' || state === 'results') state = 'title';
  else if (state === 'initials') state = 'title';
  else if (state === 'board') state = BV.back;
  else if (state === 'menu') { if (G.menuView !== 'main') G.menuView = 'main'; else resumeMenu(); }
}
function navStep(list, dx, dy) {
  if (!list.length) return;
  if (NAV.i < 0 || NAV.i >= list.length) { NAV.i = 0; return; }
  const c = list[NAV.i].r, cx = (c[0] + c[2]) / 2, cy = (c[1] + c[3]) / 2;
  let best = -1, bs = 1e9;
  list.forEach((b, k) => {
    if (k === NAV.i) return;
    const r = b.r, ox = (r[0] + r[2]) / 2 - cx, oy = (r[1] + r[3]) / 2 - cy;
    const along = ox * dx + oy * dy, side = Math.abs(ox * dy - oy * dx);
    if (along <= 2) return;
    const sc = along + side * 2.5;
    if (sc < bs) { bs = sc; best = k; }
  });
  if (best >= 0) NAV.i = best;
}
function navIniStep(dx, dy) {
  if (dx) { NAV.ini = Math.max(0, Math.min(3, NAV.ini + dx)); return; }
  if (NAV.ini < 3 && dy) BTN[NAV.ini * 3 + (dy < 0 ? 0 : 2)].f();
}
function navUpdate(dt) {
  const key = state + (state === 'menu' && G ? G.menuView : '') + (state === 'board' ? '' : '');
  if (key !== NAV.st) { NAV.st = key; NAV.i = -1; NAV.ini = 0; NAV.on = NAV.on && MENU_STATES.includes(state); }
  const list = navList();
  if (!list) { NAV.dir = null; return; }
  const jx = input.jx + input.kx, jy = input.jy + input.ky;
  let dir = null;
  if (Math.hypot(jx, jy) > 0.6) dir = Math.abs(jx) > Math.abs(jy) ? [Math.sign(jx), 0] : [0, Math.sign(jy)];
  const same = dir && NAV.dir && dir[0] === NAV.dir[0] && dir[1] === NAV.dir[1];
  if (dir && (!same || (NAV.hold -= dt) <= 0)) {

    const was = NAV.on; NAV.on = true;
    if (state === 'initials') navIniStep(dir[0], dir[1]);

  }
  NAV.dir = dir;
  if (input.aEdge) {
    input.aEdge = false;
    if (state === 'initials') {
      NAV.on = true;
      if (NAV.ini < 3) { NAV.ini++; beep(700, 0.04); } else { beep(660, 0.06); BTN[BTN.length - 1].f(); }
    } else if (!NAV.on || NAV.i < 0 || NAV.i >= list.length) { NAV.on = true; if (NAV.i < 0 || NAV.i >= list.length) NAV.i = 0; beep(880, 0.025); }
    else { if (state !== 'drive') beep(660, 0.06); list[NAV.i].f(); }
  }

  }
}
function navDraw() {
  if (!NAV.on) return;
  const list = navList(); if (!list) return;
  let r = null;
  if (state === 'initials') r = NAV.ini < 3 ? BTN[NAV.ini * 3 + 1] && BTN[NAV.ini * 3 + 1].r : BTN[BTN.length - 1] && BTN[BTN.length - 1].r;
  else if (NAV.i >= 0 && NAV.i < list.length) r = list[NAV.i].r;
  if (!r) return;
  const p = Math.sin(tt * 8) > 0 ? HI : PAPER;
  B.strokeStyle = p; B.lineWidth = 2; B.strokeRect(r[0] - 1, r[1] - 1, r[2] - r[0] + 2, r[3] - r[1] + 2); B.lineWidth = 1;
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; tt += dt;
  netFrame(dt);
  navUpdate(dt);
  if (state === 'drive' && mode.zamboni) {
    updateZamboni(dt);
    if (state === 'drive') { drawZamTop(); drawDriveBottom(); }
  } else if (state === 'drive') {
    if (G.help) updateHelp(dt); else updateDrive(dt);
    drawDriveTop(); drawDriveBottom();
  } else if (state === 'battle') {
    G.clock += dt;
    const b = G.battle;
    if (b) {
      b.shake = Math.max(0, b.shake - dt); b.flashT = Math.max(0, b.flashT - dt);
      G.popups = G.popups.filter(p => (p.t -= dt) > 0);
      drawBattleTop(); drawBattleBottom();
    }
  } else if (state === 'title') drawTitle(tt);
  else if (state === 'modes') drawModes(tt);
  else if (state === 'initials') drawInitials();
  else if (state === 'board') drawBoard();
  else if (state === 'chars') drawChars(tt);
  else if (state === 'results') drawResults();
  else if (state === 'menu') drawMenu();
  navDraw();
  input.aEdge = input.bEdge = false;
  requestAnimationFrame(frame);
}

function botXY(e) {
  const r = botC.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * SW, (e.clientY - r.top) / r.height * SH];
}
botC.addEventListener('pointerdown', e => {
  e.preventDefault(); botC.setPointerCapture(e.pointerId);
  const [x, y] = botXY(e);
  if ((state === 'drive' || state === 'battle') && inside(x, y, MENU_BTN)) { openMenu(); return; }
  if (state === 'battle') return battlePointer('down', x, y);
  if (state === 'drive' && G.help && G.help.btns && !G.help.result) {
    const k = G.help.btns.findIndex(b => inside(x, y, b.r)); if (k >= 0) { NAV.i = k; answerHelp(G.help.btns[k].a); } return;
  }
  const bi = BTN.findIndex(b => inside(x, y, b.r)), b = BTN[bi]; if (b && state === 'initials') NAV.ini = bi < 9 ? Math.floor(bi / 3) : bi === BTN.length - 1 ? 3 : NAV.ini; else if (b) NAV.i = bi; if (b && ['title', 'modes', 'chars', 'results', 'initials', 'board', 'menu'].includes(state)) { if (state !== 'initials') beep(660, 0.06); b.f(); }
});
botC.addEventListener('pointermove', e => { if (state === 'battle') { const [x, y] = botXY(e); battlePointer('move', x, y); } });
botC.addEventListener('pointerup', e => { if (state === 'battle') { const [x, y] = botXY(e); battlePointer('up', x, y); } });
botC.addEventListener('pointercancel', () => { if (G && G.battle) G.battle.drag = null; });

function bindBtn(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); if (!input[key]) { if (key === 'a') input.aEdge = true; if (key === 'b') input.bEdge = true; } input[key] = true; el.classList.add('on'); };
  const off = e => { e.preventDefault(); input[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
}
(function stick() {
  const base = document.getElementById('stick'), knob = document.getElementById('knob');
  let id = null;
  const set = e => {
    const r = base.getBoundingClientRect(), R = r.width / 2;
    let dx = (e.clientX - (r.left + R)) / (R * 0.75), dy = (e.clientY - (r.top + R)) / (R * 0.75);
    const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    input.jx = dx; input.jy = dy;
    knob.style.transform = `translate(${dx * R * 0.6}px, ${dy * R * 0.6}px)`;
  };
  base.addEventListener('pointerdown', e => { e.preventDefault(); id = e.pointerId; base.setPointerCapture(id); set(e); });
  base.addEventListener('pointermove', e => { if (e.pointerId === id) set(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; input.jx = input.jy = 0; knob.style.transform = ''; };
  base.addEventListener('pointerup', end); base.addEventListener('pointercancel', end);
})();
[['bA', 'a'], ['bB', 'b']].forEach(([i, k]) => bindBtn(i, k));
const KEYS = { z: 'a', ' ': 'a', x: 'b' };
const ARROWS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
const held = new Set();
function keyVec() { input.kx = 0; input.ky = 0; for (const k of held) { input.kx += ARROWS[k][0]; input.ky += ARROWS[k][1]; } }
addEventListener('keydown', e => { if (e.key === 'Escape') { if (state === 'menu') resumeMenu(); else openMenu(); return; } if (ARROWS[e.key]) { e.preventDefault(); held.add(e.key); keyVec(); return; } const k = KEYS[e.key]; if (!k) return; e.preventDefault(); if (!input[k]) { if (k === 'a') input.aEdge = true; if (k === 'b') input.bEdge = true; } input[k] = true; });
addEventListener('keyup', e => { if (ARROWS[e.key]) { held.delete(e.key); keyVec(); return; } const k = KEYS[e.key]; if (k) input[k] = false; });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

function fit() {
  const ctrlH = 150;
  const availH = innerHeight - ctrlH - 40, availW = innerWidth - 24;
  const s = Math.max(1, Math.min(availW / SW, availH / (SH * 2 + 10)));
  for (const c of [topC, botC]) { c.style.width = Math.floor(SW * s) + 'px'; c.style.height = Math.floor(SH * s) + 'px'; }
}
addEventListener('resize', fit);

loadImages().then(() => { buildWorld(); buildMap(); fit(); requestAnimationFrame(frame); });
